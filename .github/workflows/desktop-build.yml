name: Build desktop artifacts

# Builds the Catalyst desktop app for macOS and Windows.
#
# Each OS builds on its own runner because the app ships `node-pty`, a native
# module: cross-compiling it is not supported, so a mac .dmg has to come from a
# macOS runner and a Windows .exe from a Windows runner.
#
# Signing is intentionally optional. The repo is private and internal, so most
# builds are unsigned developer artifacts; the signing/notarization steps only
# engage when the corresponding secrets are present. An unsigned macOS build
# still runs — Control-click → Open, or approve under System Settings →
# Privacy & Security. Windows shows a SmartScreen warning that can be
# dismissed via "More info" → "Run anyway".
#
# Runs daily at 06:00 UTC, but only when HEAD differs from the last successful
# run — an unchanged repo costs one API call instead of two 20-minute runners.
# Building on every push was never worth it for artifacts nobody asked for.
# Manual dispatch and v* tags bypass the gate: those are explicit intent.

on:
  schedule:
    # 06:00 UTC daily. The `gate` job below turns this into "build at most once
    # a day, and only when something actually changed" — an unchanged repo
    # costs one API call instead of two 20-minute runners.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: both
        options: [both, macos, windows]
      make_release:
        description: Attach the artifacts to a GitHub Release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a Release; harmless otherwise

concurrency:
  # One build per ref. A newer push supersedes an in-flight build rather than
  # queueing a second 20-minute macOS job behind it.
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Answers one question: is there anything new to build?
    #
    # A scheduled build that re-packages an unchanged commit produces an
    # artifact identical to yesterday's, so we compare HEAD against the SHA of
    # the last successful run of this workflow. Manual dispatches and tag
    # pushes bypass the check — those are explicit intent, and second-guessing
    # them is just surprising.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      platforms: ${{ steps.decide.outputs.platforms }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve platform selection HERE rather than in the matrix: `inputs`
          # is not dependable during matrix expansion, and getting it wrong
          # skips every step and yields a green run that built nothing.
          want="${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'both' }}"
          echo "platforms=${want:-both}" >> "$GITHUB_OUTPUT"
          echo "::notice::platforms=${want:-both}"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — building on request."
            exit 0
          fi

          last=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/desktop-build.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')

          if [ "$last" = "${{ github.sha }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA:0:8} already built successfully — skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New commits since ${last:-'(no prior run)'} — building."
          fi

  build:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only the gate lives here: a job-level `if` is evaluated BEFORE the matrix
    # expands, so `matrix` is not in scope (actionlint catches this; GitHub
    # just fails the whole run with no jobs). Platform selection is therefore
    # done per-entry via `matrix.selected` below.
    if: needs.gate.outputs.build == 'true'
    strategy:
      # One platform failing should not discard the other's artifact — a
      # usable mac build is still worth having when Windows breaks.
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg + zip)
            os: macos-14           # arm64 runner
            script: dist:mac:dmg
            artifact: catalyst-macos
            selector: 'apps/desktop/release/*.dmg'
            platform: macos
          - name: Windows (nsis)
            os: windows-latest
            script: dist:win:nsis
            artifact: catalyst-windows
            selector: 'apps/desktop/release/*.exe'
            platform: windows

    steps:
      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # write-build-stamp.mjs records the commit the app pins to for
          # updates; a shallow clone still exposes GITHUB_SHA, which that
          # script prefers in CI, so fetch-depth 1 is fine.
          fetch-depth: 1

      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        # npm ci needs the root lockfile: the desktop app is a workspace and
        # its native deps are hoisted to the repo root.
        run: npm ci

      - name: Typecheck and lint
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        working-directory: apps/desktop
        run: |
          npm run typecheck
          npm run lint

      - name: Build (${{ matrix.script }})
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        working-directory: apps/desktop
        env:
          # Node 22 warns loudly about experimental webstorage during the
          # Electron build; the local build scripts disable it the same way.
          NODE_OPTIONS: --no-experimental-webstorage
          # electron-builder publishes to GitHub when it detects a token.
          # Releases are handled explicitly below, so keep that off.
          GH_TOKEN: ''
          # Signing — each is a no-op when the secret is absent, which is the
          # normal case for internal builds.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run ${{ matrix.script }}

      - name: Report what was produced
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        shell: bash
        working-directory: apps/desktop/release
        # Surfaces the artifact name and size in the log, and fails loudly if
        # the build "succeeded" without emitting an installer — silent empty
        # output is the failure mode worth catching here.
        run: |
          ls -la
          if ! ls ${{ matrix.selector }} >/dev/null 2>&1; then
            echo "::error::no installer matched ${{ matrix.selector }}"
            exit 1
          fi

      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          # Ship the blockmaps too: electron-builder's differential updater
          # uses them, and they are useless if separated from the installer.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    # Only for a tag push or an explicit request — and never when `build` was
    # skipped, since `needs: build` alone is satisfied by a skipped job and
    # would publish an empty release.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' || inputs.make_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Refuse to publish an empty release
        # A build whose steps all skipped still reports success, and without
        # this the release job cheerfully publishes zero files. Silence is the
        # failure mode worth catching.
        run: |
          found=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) | wc -l)
          echo "installers found: $found"
          find artifacts -type f | head -20
          if [ "$found" -eq 0 ]; then
            echo "::error::no installers were produced — refusing to publish an empty release"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: artifacts/**/*
          # Tag pushes name themselves; a manual run gets a dated draft so it
          # cannot be mistaken for a published version.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body: |
            Catalyst desktop build.

            These artifacts are **unsigned** unless signing secrets were
            configured for this run. On macOS, Control-click the app and choose
            **Open** (or approve it under System Settings → Privacy & Security).
            On Windows, choose **More info → Run anyway** at the SmartScreen
            prompt.
