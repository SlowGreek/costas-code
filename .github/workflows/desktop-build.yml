name: Build desktop artifacts

# Builds the Catalyst desktop app for macOS and Windows.
#
# Each OS builds on its own runner because the app ships `node-pty`, a native
# module: cross-compiling it is not supported, so a mac .dmg has to come from a
# macOS runner and a Windows .exe from a Windows runner.
#
# Signing is intentionally optional. The repo is private and internal, so most
# builds are unsigned developer artifacts; the signing/notarization steps only
# engage when the corresponding secrets are present. An unsigned macOS build
# still runs — Control-click → Open, or approve under System Settings →
# Privacy & Security. Windows shows a SmartScreen warning that can be
# dismissed via "More info" → "Run anyway".
#
# Runs daily at 06:00 UTC, but only when HEAD differs from the last successful
# run — an unchanged repo costs one API call instead of two 20-minute runners.
# Deliberately NOT per-push. macOS runners bill at a 10x multiplier, so one
# build (mac + windows) costs ~54 billed minutes. At this repo's real rate —
# 8 pushes in a day — per-push would be ~13,000 min/month against a 3,000-min
# allowance. Four times over budget to produce artifacts nobody downloads.
#
# Instead:
#   schedule          once a day, and only when HEAD actually changed
#   workflow_dispatch when you want an artifact now (this is the common one)
#   v* tags           a real release
#
# `concurrency` still cancels superseded runs so a burst can't stack.

on:
  schedule:
    # 06:00 UTC daily. The `gate` job below turns this into "build at most once
    # a day, and only when something actually changed" — an unchanged repo
    # costs one API call instead of two 20-minute runners.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: both
        options: [both, macos, windows]
      make_release:
        description: Attach the artifacts to a GitHub Release
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a Release; harmless otherwise

concurrency:
  # One build per ref. A newer push supersedes an in-flight build rather than
  # queueing a second 20-minute macOS job behind it.
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Answers one question: is there anything new to build?
    #
    # Only the SCHEDULED run needs asking: it fires whether or not anything
    # changed, and re-packaging an unchanged commit produces an artifact
    # identical to yesterday's, so it compares HEAD against the SHA of the last
    # successful run. Pushes, manual dispatches and tags always build — a push
    # is by definition new code, and second-guessing explicit intent is just
    # surprising.
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      platforms: ${{ steps.decide.outputs.platforms }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve platform selection HERE rather than in the matrix: `inputs`
          # is not dependable during matrix expansion, and getting it wrong
          # skips every step and yields a green run that built nothing.
          want="${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'both' }}"
          echo "platforms=${want:-both}" >> "$GITHUB_OUTPUT"
          echo "::notice::platforms=${want:-both}"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ github.event_name }} — building on request."
            exit 0
          fi

          # Ask what was actually BUILT, not what merely ran. A dispatch with
          # platforms=macos succeeds with the same head_sha while the Windows
          # job is skipped; matching on sha alone would then let tonight's
          # schedule skip too, and that commit would never get a Windows
          # artifact. So require a prior run whose mac AND windows jobs both
          # concluded 'success'.
          last=""
          for run_id in $(gh api \
            "repos/${{ github.repository }}/actions/workflows/desktop-build.yml/runs?status=success&per_page=10" \
            --jq '.workflow_runs[].id'); do
            complete=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/jobs" \
              --jq '[.jobs[] | select(.name | test("macOS|Windows")) | .conclusion]
                    | length == 2 and all(. == "success")')
            if [ "$complete" = "true" ]; then
              last=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id" --jq .head_sha)
              break
            fi
          done

          if [ "$last" = "${{ github.sha }}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${GITHUB_SHA:0:8} already built — nothing changed, skipping."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New commits since ${last:-'(no prior run)'} — building."
          fi

  build:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Only the gate lives here: a job-level `if` is evaluated BEFORE the matrix
    # expands, so `matrix` is not in scope (actionlint catches this; GitHub
    # just fails the whole run with no jobs). Platform selection is therefore
    # done per-entry via `matrix.selected` below.
    if: needs.gate.outputs.build == 'true'
    strategy:
      # One platform failing should not discard the other's artifact — a
      # usable mac build is still worth having when Windows breaks.
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg + zip)
            os: macos-14           # arm64 runner
            script: dist:mac:dmg
            artifact: catalyst-macos
            ext: dmg
            platform: macos
          - name: Windows (nsis)
            os: windows-latest
            script: dist:win:nsis
            artifact: catalyst-windows
            ext: exe
            platform: windows

    steps:
      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # write-build-stamp.mjs records the commit the app pins to for
          # updates; a shallow clone still exposes GITHUB_SHA, which that
          # script prefers in CI, so fetch-depth 1 is fine.
          fetch-depth: 1

      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        # npm ci needs the root lockfile: the desktop app is a workspace and
        # its native deps are hoisted to the repo root.
        run: npm ci

      - name: Typecheck and lint
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        working-directory: apps/desktop
        # Every multi-line run step pins bash: the Windows runner's default
        # PowerShell silently changes the language these blocks are written in.
        shell: bash
        run: |
          npm run typecheck
          npm run lint

      - name: Exercise non-admin Peeps certificate around Windows trust consent
        if: (needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform) && matrix.platform == 'windows'
        working-directory: apps/desktop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $userName = 'PeepsCert' + [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $profilePath = "C:\Users\$userName"
          $userData = Join-Path $profilePath 'AppData\Roaming\Catalyst'
          $passwordBytes = New-Object byte[] 32
          $rng = [Security.Cryptography.RandomNumberGenerator]::Create()
          try { $rng.GetBytes($passwordBytes) } finally { $rng.Dispose() }
          $passwordText = [Convert]::ToBase64String($passwordBytes)
          [Array]::Clear($passwordBytes, 0, $passwordBytes.Length)
          $securePassword = ConvertTo-SecureString $passwordText -AsPlainText -Force
          $testError = $null
          $cleanupErrors = [Collections.Generic.List[string]]::new()
          $childScript = $null
          $userSid = $null
          try {
            New-LocalUser -Name $userName -Password $securePassword -AccountNeverExpires -PasswordNeverExpires | Out-Null
            $userSid = (Get-LocalUser -Name $userName -ErrorAction Stop).Sid.Value
            $credential = New-Object Management.Automation.PSCredential(".\$userName", $securePassword)
            $node = (Get-Command node.exe).Source
            $electronPackage = (& $node -p "require.resolve('electron/package.json')").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $electronPackage) { throw 'Could not resolve Electron package' }
            $electron = Join-Path (Split-Path -Parent $electronPackage) 'dist\electron.exe'
            $vitestPackage = (& $node -p "require.resolve('vitest/package.json')").Trim()
            if ($LASTEXITCODE -ne 0 -or -not $vitestPackage) { throw 'Could not resolve Vitest package' }
            $vitest = Join-Path (Split-Path -Parent $vitestPackage) 'vitest.mjs'
            $childScript = Join-Path $env:RUNNER_TEMP ("peeps-cert-test-$userName.ps1")
            @"
          `$ErrorActionPreference = 'Stop'
          `$env:USERPROFILE = '$profilePath'
          `$env:APPDATA = '$profilePath\AppData\Roaming'
          `$env:LOCALAPPDATA = '$profilePath\AppData\Local'
          `$env:TEMP = '$profilePath\AppData\Local\Temp'
          `$env:TMP = `$env:TEMP
          `$env:HERMES_PEEPS_TEST_USER_DATA = '$userData'
          `$env:HERMES_ELECTRON_PATH = '$electron'
          New-Item -ItemType Directory -Force -Path `$env:APPDATA,`$env:LOCALAPPDATA,`$env:TEMP | Out-Null
          & '$node' '$vitest' run --project electron electron/peeps-voice-auth-windows-live.test.ts --reporter=verbose
          exit `$LASTEXITCODE
          "@ | Set-Content -LiteralPath $childScript -Encoding UTF8
            $arguments = @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', "`"$childScript`"")
            $process = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -WorkingDirectory (Get-Location).Path -Credential $credential -LoadUserProfile -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Non-admin Peeps certificate test failed with exit code $($process.ExitCode)" }
          } catch {
            $testError = $_
          } finally {
            if ($childScript) {
              try {
                if (Test-Path -LiteralPath $childScript) { Remove-Item -LiteralPath $childScript -Force -ErrorAction Stop }
              } catch { $cleanupErrors.Add("child script deletion failed: $($_.Exception.Message)") }
              if (Test-Path -LiteralPath $childScript) { $cleanupErrors.Add('child script still exists') }
            }
            try {
              $temporaryUser = Get-LocalUser -Name $userName -ErrorAction Stop
              Remove-LocalUser -Name $temporaryUser.Name -ErrorAction Stop
            } catch [Microsoft.PowerShell.Commands.UserNotFoundException] {
              # Expected when account creation failed before committing the user.
            } catch { $cleanupErrors.Add("local user deletion failed: $($_.Exception.Message)") }
            try {
              Get-LocalUser -Name $userName -ErrorAction Stop | Out-Null
              $cleanupErrors.Add('Get-LocalUser still found the temporary account')
            } catch [Microsoft.PowerShell.Commands.UserNotFoundException] {
              # Expected fail-closed postcondition.
            } catch { $cleanupErrors.Add("Get-LocalUser verification failed: $($_.Exception.Message)") }
            try {
              @(Get-CimInstance Win32_UserProfile -ErrorAction Stop | Where-Object { $_.LocalPath -eq $profilePath -or ($userSid -and $_.SID -eq $userSid) }) | ForEach-Object { Remove-CimInstance -InputObject $_ -ErrorAction Stop }
            } catch { $cleanupErrors.Add("profile deletion failed: $($_.Exception.Message)") }
            try {
              if (Get-CimInstance Win32_UserProfile -ErrorAction Stop | Where-Object { $_.LocalPath -eq $profilePath -or ($userSid -and $_.SID -eq $userSid) }) { $cleanupErrors.Add('temporary profile row still exists') }
            } catch { $cleanupErrors.Add("profile verification failed: $($_.Exception.Message)") }
            try {
              if (Test-Path -LiteralPath $profilePath) { Remove-Item -LiteralPath $profilePath -Recurse -Force -ErrorAction Stop }
            } catch { $cleanupErrors.Add("profile directory deletion failed: $($_.Exception.Message)") }
            if (Test-Path -LiteralPath $profilePath) { $cleanupErrors.Add('temporary profile directory still exists') }
            $passwordText = $null
            $securePassword = $null
          }
          if ($cleanupErrors.Count -gt 0) { throw ($cleanupErrors -join '; ') }
          if ($testError) { throw $testError }

      - name: Build (${{ matrix.script }})
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        working-directory: apps/desktop
        env:
          # Node 22 warns loudly about experimental webstorage during the
          # Electron build; the local build scripts disable it the same way.
          NODE_OPTIONS: --no-experimental-webstorage
          # electron-builder auto-publishes when it detects CI. We attach
          # artifacts to a release explicitly in the job below, so turn its
          # implicit publishing off rather than racing it.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Signing secrets are passed ONLY when they exist. An empty CSC_LINK
          # is not "no signing" to electron-builder — it treats the empty
          # string as a certificate path and dies with "<dir> not a file",
          # which is exactly how the first CI run failed.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # bash explicitly: Windows runners default to PowerShell, which cannot
        # parse the loop below ("Missing opening '(' after keyword 'for'").
        shell: bash
        run: |
          # Strip empty signing vars so electron-builder takes its unsigned
          # path instead of trying to open '' as a cert.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Stamp a unique SemVer 2.0.0 version so two builds are never
          # indistinguishable by filename or About box. Restored afterwards so
          # the tree isn't left dirty — electron-builder reads the version from
          # package.json and has no override flag.
          node scripts/apply-build-version.mjs
          trap 'node scripts/apply-build-version.mjs --restore' EXIT
          npm run ${{ matrix.script }} -- --publish never

      - name: Report what was produced
        if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        shell: bash
        working-directory: apps/desktop/release
        # Surfaces the artifact name and size in the log, and fails loudly if
        # the build "succeeded" without emitting an installer — silent empty
        # output is the failure mode worth catching here.
        run: |
          ls -la
          # Glob is relative to working-directory (release/), so match on the
          # bare extension rather than a repo-root path.
          if ! ls *.${{ matrix.ext }} >/dev/null 2>&1; then
            echo "::error::build reported success but produced no .${{ matrix.ext }}"
            exit 1
          fi

      - if: needs.gate.outputs.platforms == 'both' || needs.gate.outputs.platforms == matrix.platform
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.artifact }}
          # Ship the blockmaps too: electron-builder's differential updater
          # uses them, and they are useless if separated from the installer.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach to release
    needs: build
    # A TAG push or an explicit request. `ref_type == 'tag'` rather than
    # `event_name == 'push'`: the latter would also fire on an ordinary branch
    # push if the trigger is ever widened again, cutting a release per commit.
    #
    # Never when `build` was skipped either: `needs: build` alone is satisfied
    # by a skipped job and would publish an empty release.
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (github.ref_type == 'tag' || inputs.make_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artifacts

      - name: Refuse to publish an empty release
        # A build whose steps all skipped still reports success, and without
        # this the release job cheerfully publishes zero files. Silence is the
        # failure mode worth catching.
        run: |
          found=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) | wc -l)
          echo "installers found: $found"
          find artifacts -type f | head -20
          if [ "$found" -eq 0 ]; then
            echo "::error::no installers were produced — refusing to publish an empty release"
            exit 1
          fi

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: artifacts/**/*
          # Tag pushes name themselves; a manual run gets a dated draft so it
          # cannot be mistaken for a published version.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          body: |
            Catalyst desktop build.

            These artifacts are **unsigned** unless signing secrets were
            configured for this run. On macOS, Control-click the app and choose
            **Open** (or approve it under System Settings → Privacy & Security).
            On Windows, choose **More info → Run anyway** at the SmartScreen
            prompt.
