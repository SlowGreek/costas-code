# Nous-approved first-party MCP catalog entry.
# RUN owns the one packaged Butler service. Hermes is a thin MCP client of its
# loopback endpoint; no private child process or model-visible authority material.
manifest_version: 1

name: lucid-quine
description: AgentExperiments LUCID — seven closed verbs for QUINE-governed projects, evidence, dispatch, steering, and cancellation.
source: https://github.com/microsoft/AgentExperiments

transport:
  type: http
  url: http://127.0.0.1:4176/mcp
  version: "1.0.0"

auth:
  type: none

tools:
  default_enabled:
    - lucid.show
    - lucid.get
    - lucid.set
    - lucid.morph
    - lucid.dispatch
    - lucid.steer
    - lucid.cancel

post_install: |
  LUCID is the shared local MCP service hosted by RUN-supervised Butler.
  It exposes the closed show/get/set/morph/dispatch/steer/cancel grammar plus
  read-only onboarding and current-system resources. Resources and prompts grant
  no authority. Consequential calls still require Butler/Envelope capability and
  confirmation checks, and QUINE remains the acceptance owner.

  RUN must be active on the Desktop backend. Open the MCP tab to test the shared
  loopback connection and inspect the exact seven tools.
