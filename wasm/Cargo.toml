[package]
name = "catalyst-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Catalyst's thin UGUI client: the shared native_webview engine compiled for the Electron renderer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ugui-render = { package = "ugui", path = "../../ugui" }
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "EventTarget", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Node", "NodeList", "Window"] }
